spring.profiles.active=local

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=poa123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=poa-ssl-key

# OAuth2 Configuration
spring.security.oauth2.client.registration.keycloak.client-id=poa-client
spring.security.oauth2.client.registration.keycloak.client-secret=secret
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/poa-realm

#Mongo
spring.data.mongodb.uri=mongodb://host.docker.internal:27017/test

#Logging
logging.level.org.mongodb.driver=ERROR
logging.level.org.springframework.web=ERROR

# Prometheus Metrics
management.endpoints.web.exposure.include: prometheus, health, info
management.endpoints.prometheus.enabled: true